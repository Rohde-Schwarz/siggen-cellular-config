# § 7.4.1 Adjacent Channel Selectivity (ACS)

# Table 7.4.1.5-2: SAN LEO class standalone NB-IoT FDD ACS (PREFSENS from TS 36.181 Table 7.2.5-4)

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels
# for ACS according to annex A.14.
# Set the signal generator for the wanted signal power as specified in table 7.4.1.5-2.
# Set the interfering signal (uplink PUSCH) at the frequency offset specified in
# table 7.4.1.5-2.

# Interferer signal can be placed on lower or upper side of the SAN channel bandwidth.
# Use parameter "edge" to place the interferer signal in one of the sides.

[test]
bw                 = 0.2     # channel bandwidth in MHz
scs                = 15     # sub-carrier spacing in kHz (15, 3.75)
san_class          = leo    # SAN class: leo or geo
edge               = upper  # position of the interferer signal: lower or upper
cell_id            = 150      # cell ID
ue_id              = 1      # UE ID
interferer_cell_id = 1      # interferer cell ID
interferer_ue_id   = 1      # interferer UE ID

freq = 1620000000           # RF frequency in Hz

tdd = false  # true to use NB-IoT TDD (BW 200 kHz, SCS 15 kHz only)
