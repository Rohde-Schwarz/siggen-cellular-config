# § 7.8 In-channel Selectivity (ICS)

# Table 7.8.5-1: SAN GEO class ICS wanted + interfering power

# Set the signal generator for the wanted signal to transmit as specified from table 7.8.5-1.
# Set the signal generator for the interfering signal as specified from table 7.8.5-1 and
# specified from Annex E for In-channel selectivity.

# Interferer signal can be placed at lower or higher resource blocks.
# Use parameter "interference_pos" to set whether the interfering signal is placed at lower or higher resource blocks.

[test]
bw                 = 1.4      # channel bandwidth in MHz
scs                = 15      # sub-carrier spacing in kHz
san_class          = geo     # SAN class: leo or geo
interference_pos   = lower   # position of the interferer signal: higher or lower
cell_id            = 150     # cell ID
ue_id              = 1       # UE ID
interferer_cell_id = 1       # interferer cell ID
interferer_ue_id   = 2       # interferer UE ID

freq = 1620000000           # RF frequency in Hz
