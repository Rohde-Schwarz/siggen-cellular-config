# § 7.2 Reference Sensitivity Level

# Table 7.2.5-4: SAN LEO class NB-IoT FDD reference sensitivity levels

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels
# for reference sensitivity according to annex A.14.
# Set the signal generator for the wanted signal power as specified in table 7.2.5-4.

[test]
bw            = 0.2    # channel bandwidth in MHz
scs           = 3.75   # sub-carrier spacing in kHz (15, 3.75)
san_class     = leo    # SAN class: leo or geo
cell_id       = 150      # cell ID
ue_id         = 1        # UE ID

freq = 1620000000      # RF frequency in Hz

tdd = false  # true to use NB-IoT TDD FRC (BW 200 kHz, SCS 15 kHz only)
