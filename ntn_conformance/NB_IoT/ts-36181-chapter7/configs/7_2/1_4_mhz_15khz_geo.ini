# § 7.2 Reference Sensitivity Level

# Table 7.2.5-1: SAN GEO class reference sensitivity levels

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels
# for reference sensitivity according to annex A.1.
# Set the signal generator for the wanted signal power as specified in clause 7.2.5-1

[test]
bw            = 1.4      # channel bandwidth in MHz
scs           = 15     # sub-carrier spacing in kHz
san_class     = geo    # SAN class: leo or geo
cell_id       = 150      # cell ID
ue_id         = 1        # UE ID

freq = 1620000000      # RF frequency in Hz
