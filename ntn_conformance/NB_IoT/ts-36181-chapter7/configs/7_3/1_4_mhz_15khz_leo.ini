# § 7.3 Dynamic Range

# Table 7.3.5-1: SAN LEO class E-UTRA 1.4 MHz dynamic range

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels
# for dynamic range according to annex A.2.
# Set the signal generator for the wanted signal power as specified in table 7.3.5-1.
# Set the AWGN interfering signal at the same frequency as the wanted signal as specified
# in table 7.3.5-1.

[test]
bw            = 1.4      # channel bandwidth in MHz
scs           = 15       # sub-carrier spacing in kHz (15)
san_class     = leo      # SAN class: leo or geo
cell_id       = 150      # cell ID
ue_id         = 1        # UE ID

freq = 1620000000      # RF frequency in Hz