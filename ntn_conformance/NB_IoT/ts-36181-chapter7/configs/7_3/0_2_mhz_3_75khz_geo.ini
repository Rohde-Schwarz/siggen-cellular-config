# § 7.3 Dynamic Range

# Table 7.3.5-2: SAN GEO class standalone NB-IoT FDD dynamic range

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels
# for dynamic range according to annex A.15.
# Set the signal generator for the wanted signal power as specified in table 7.3.5-2.
# Set the AWGN interfering signal at the same frequency as the wanted signal as specified
# in table 7.3.5-2.

[test]
bw            = 0.2    # channel bandwidth in MHz
scs           = 3.75   # sub-carrier spacing in kHz (15, 3.75)
san_class     = geo    # SAN class: leo or geo
cell_id       = 150      # cell ID
ue_id         = 1        # UE ID

freq = 1620000000      # RF frequency in Hz

tdd = false  # true to use NB-IoT TDD FRC (BW 200 kHz, SCS 15 kHz only)
