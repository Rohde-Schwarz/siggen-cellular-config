# §8.2.1 Performance requirements of PUSCH in multipath fading propagation conditions
# transmission on single antenna port for coverage enhancement
#
# The performance requirement of PUSCH is determined by a minimum required throughput for a given SNR.
# The required throughput is expressed as a fraction of maximum throughput for the FRCs listed in annex A.
# The performance requirements assume HARQ re-transmissions.
#
# The tests for CEModeA are applicable only to SANs supporting coverage enhancement configured with CEModeA.
# The tests for CEModeB are applicable only to SANs supporting coverage enhancement configured with CEModeB.
#
# The throughput measured according to clause 8.2.1.4.2 shall not be below the limits for the SNR levels specified
# in table 8.2.1.5-1 for CEMode A tests and not be below the limits for the SNR levels specified in
# table 8.2.1.5-2 for CEMode B tests.

# Table 8.2.1.5-2 FDD: 1 TX, 1 RX, Mode B, 256 repetitions, 1.4 MHz, 15 kHz,
# FRC A5-1 (1 RB, QPSK 1/3), NTN-TDLA100-5, 70% of maximum throughput,
# frequency offset 128 Hz, timing 0.01 us/subframe, SNR -11.0 dB

# eMTC PUSCH CEMode B

[test]
num_rx          = 1                    # number of RX antennas: 1 or 2
ce_mode         = B                    # A → 8 repetitions (Table 8.2.1.5-1); B → 256 (Table 8.2.1.5-2)
repetition_num  = 256                  # must match ce_mode: A=8, B=256
scs             = 15                   # sub-carrier spacing in kHz (15)
propagation     = NTN-TDLA100-5        # NTN-TDLA100-5 / NTN-TDLC5-5
cell_id         = 150                  # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz (clause 8.2.1.4.1: channel M)
