# §8.5.2 ACK missed detection for NPUSCH format 2

# The performance requirement of NPUSCH format 2 for ACK missed detection is determined by the two parameters:
# probability of false detection of the ACK and the probability of detection of ACK. The performance is measured by the
# required SNR at probability of detection equal to 0.99. The probability of false detection of the ACK shall be 0.01 or
# less.

# The probability of false detection of the ACK is defined as a conditional probability of erroneous detection of the ACK
# when input is only noise.

# The probability of detection of ACK is defined as conditional probability of detection of the ACK when the ACK was
# sent per NPUSCH format 2 transmission when the signal is present.

# The tests for 3.75 kHz subcarrier spacing are applicable to the base stations supporting 3.75 kHz subcarrier spacing
# requirements. The tests for 15 kHz subcarrier spacing are applicable to the base stations supporting 15 kHz subcarrier
# spacing requirements.


# The multipath fading emulators shall be configured according to the corresponding channel model defined in annex F.

# Adjust the equipment so that the SNR specified in tables 8.5.2.5-1 to 8.5.2.5-3 is achieved at the SAN input during the ACK transmissions

# The signal generator sends a test pattern with the pattern outlined in figure 8.5.2.4.2-1. 
# The following statistics are kept: the number of ACKs falsely detected in the idle periods and the number of missed ACKs. 
# Each falsely detected ACK transmission in the idle periods is accounted as one error for the statistics of false ACK detection, 
# and each missed ACK transmission per NPUSCH format 2 transmission is accounted as one error for the statistics of missed ACK detection. 
# The frames are sent with certain frequency and time offsets. 

# Table 8.5.2.5-1 FDD: 1 TX, 1 RX, Repetition 16, 3.75 kHz, NTN-TDLA100-1,
# accumulated frequency offset 64 Hz, timing 0.08 us/RU, SNR 2.4 dB

# NPUSCH format 2

[test]
num_rx          = 1                    # number of RX antennas: 1 or 2
repetition_num  = 16                   # NPUSCH format 2
scs             = 3.75                 # sub-carrier spacing in kHz: 3.75 or 15
propagation     = NTN-TDLA100-1        # propagation condition: NTN-TDLA100-1
tdd             = false                # false = Table 8.5.2.5-1, 8.5.2.5-2 FDD; true = 8.5.2.5-3 TDD
cell_id         = 150                  # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz
