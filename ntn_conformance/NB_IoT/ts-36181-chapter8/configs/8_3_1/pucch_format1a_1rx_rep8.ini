# §8.3.1 ACK missed detection for PUCCH format 1a transmission
# on single antenna port for coverage enhancement
#
# The performance requirement of PUCCH for ACK missed detection is determined by two parameters:
# The probability of false detection of the ACK and the probability of detection of ACK.
# The performance is measured for the required SNR
# - at probability of detection which shall not be smaller than 99% and
# - at probability of false detection of the ACK which shall not be larger than 1%.
#
# Table 8.3.1.2.1-1 FDD: 1.4 MHz, 1 TX, Normal CP, 8 repetitions, 15 kHz,
# PUCCH format 1a, NTN-TDLA100-5, frequency offset 4 Hz, timing 0.01 us/subframe,
# SNR -2.0 dB (1 RX)

# eMTC PUCCH format 1a

[test]
num_rx          = 1                    # number of RX antennas: 1 or 2
repetition_num  = 8                    # 8 repetitions (Table 8.3.1.2.1-1)
propagation     = NTN-TDLA100-5        # Table 8.3.1.2.1-1
cell_id         = 150                  # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz (clause 8.3.1.4.1: channel M)
