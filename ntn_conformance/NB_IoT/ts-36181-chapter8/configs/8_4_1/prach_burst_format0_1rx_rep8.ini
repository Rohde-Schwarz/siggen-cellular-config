# §8.4.1 PRACH — false alarm probability and missed detection
#
# The performance requirement of PRACH for preamble detection is determined by two parameters:
# the probability of false detection of the preamble (Pfa) and the probability of detection (Pd).
# The performance is measured for the required SNR
# - at probability of detection which shall not be smaller than 99% and
# - at probability of false detection which shall not be larger than 0.1%.
#
# Table 8.4.1.5-1 FDD: 1.4 MHz, 1 TX, burst format 0, 8 repetitions,
# PRACH frequency hopping OFF, NTN-TDLA100-5, frequency offset 270 Hz,
# time error tolerance 2.08 us, SNR -10.4 dB (1 RX)

# eMTC PRACH

[test]
num_rx          = 1                    # number of RX antennas: 1 or 2
repetition_num  = 8                    # burst formats 0/1: 8; formats 2/3: 16 (Table 8.4.1.5-1)
burst_format    = 0                    # burst format: 0, 1, 2, or 3
propagation     = NTN-TDLA100-5        # Table 8.4.1.5-1
cell_id         = 150                  # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz
