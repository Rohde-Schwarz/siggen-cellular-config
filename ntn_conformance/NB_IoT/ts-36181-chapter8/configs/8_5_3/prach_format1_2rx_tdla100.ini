# §8.5.3 Performance requirements for NPRACH

# the total probability of false detection of the preamble (Pfa) and the probability of detection of the preamble (Pd)
# The performance is measured by the required SNR at probability of detection, Pd of 99%. Pfa shall be 0.1% or less.

# Pfa is the conditional total probability of erroneous detection of the preamble (i.e., erroneous detection from
# any detector) when input is only noise.

# Pd is conditional probability of detection of the preamble when the signal is present.
# The erroneous detection consists of several error cases – detecting different preamble than the one that was sent,
# not detecting a preamble at all or correct preamble detection but with the wrong timing estimation.
# A timing estimation error occurs if the estimation error of the timing of the strongest path is larger than 3.646 us.
# The strongest path for the timing estimation error refers to the strongest path in the power delay profile.


# The characteristics of the wanted signal shall be configured according to the corresponding UL reference
# measurement channel defined in annex A.

# The multipath fading emulators shall be configured according to the corresponding channel model defined in annex F.

# Adjust the frequency offset of the test signal according to table 8.5.3.5-1/2

# Adjust the equipment so that the SNR in table 8.5.3.5-1/2 is achieved at the SAN input during the PRACH preambles.

# The test signal generator sends a preamble with repetitions, and the receiver tries to detect the preamble.
# This pattern is repeated as illustrated in figure 8.5.3.4.2-1. The preambles are sent with a fixed timing offset of
# 0.5 T_CP during the test, where T_CP is NPRACH cyclic prefix of length as defined in TS 36.211.

# The following statistics are kept: number of preambles detected in the idle period and the number of missed preambles


# Table 8.5.3.5-1 FDD: 1 TX, 2 RX, Repetition 8, NTN-TDLA100-1,
# Preamble format 1, Frequency offset 200 Hz, SNR 6.7 dB

[test]
num_rx          = 2                    # number of RX antennas: 1 or 2
repetition_num  = 8                    # NPRACH repetition number: FDD 8/16, TDD 4/8
propagation     = NTN-TDLA100-1        # propagation condition: NTN-TDLA100-1 / NTN-TDLC5-1
preamble_format = 1                    # Preamble format: 0 or 1
tdd             = false                # false = Table 8.5.3.5-1 FDD; true = Table 8.5.3.5-2 TDD
cell_id         = 0                    # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz
