# §8.5.1 Performance requirements for NPUSCH format 1

# The performance requirement of NPUSCH format 1 is determined by a minimum required throughput for a given SNR.
# The required throughput is expressed as a fraction of maximum throughput for the FRCs listed in annex A.
# The performance requirements assume HARQ re-transmissions.

# The throughput measured according to clause 8.5.1.4.2 shall not be below the limits for the SNR levels specified
# in table 8.5.1.5-1 for 3.75 kHz subcarrier spacing tests and not be below the limits for the SNR levels specified
# in table 8.5.1.5-2 for FDD 15 kHz subcarrier spacing and in table 8.5.1.5-3 for TDD 15 kHz subcarrier spacing
# with the supported number of subcarrier tests.

# The throughput measured for each UE according to clause 8.5.1.4.2 shall not below the limits for the SNR levels
# specified in table 8.5.1.5-4 for 3.75 kHz subcarrier spacing with supporting symbol-level length-2 OCC tests and
# not be below the limits for the SNR levels specified in table 8.5.1.5-5 for 15 kHz subcarrier spacing with
# supporting slot-level length-2 OCC tests.

# Table 8.5.1.5-1 FDD: 1 TX, 2 RX, Repetition 4, 3.75 kHz, 1 allocated SC, FRC A16-1, NTN-TDLC5-1,
# 70% of maximum throughput, accumulated frequency offset 128 Hz, timing 0.32 us/RU, SNR -5.9 dB

# NPUSCH format 1

[test]
num_rx          = 2                    # number of RX antennas: 1 or 2
repetition_num  = 4                    # NPUSCH format 1: FDD 4 (3.75 kHz)
scs             = 3.75                 # sub-carrier spacing in kHz: 3.75 or 15
propagation     = NTN-TDLC5-1          # propagation condition: NTN-TDLA100-1 / NTN-TDLC5-1
tdd             = false                # false = Table 8.5.1.5-1, 8.5.1.5-2 FDD; true = 8.5.1.5-3 TDD
cell_id         = 150                  # cell ID
ue_id           = 1                    # UE ID

freq            = 1620000000           # RF frequency in Hz
