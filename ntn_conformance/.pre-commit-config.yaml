repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (ntn_conformance)
        entry: ruff check .
        language: python
        additional_dependencies: [ruff==0.16.2]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
