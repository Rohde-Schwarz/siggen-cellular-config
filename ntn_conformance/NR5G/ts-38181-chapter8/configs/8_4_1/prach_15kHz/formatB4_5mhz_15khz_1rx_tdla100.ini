# § 8.4.1 Performance requirements for PRACH - preamble detection

# The performance is measured by the required SNR at probability of detection, Pd of 99%. Pfa shall be 0.1% or less. 

# Pfa is the conditional total probability of erroneous detection of the preamble (i.e., erroneous detection from 
# any detector) when input is only noise. 

# Pd is the conditional probability of detection of the preamble when the signal is present. The erroneous detection 
# consists of several error cases – detecting only different preamble(s) than the one that was sent, not detecting any 
# preamble at all, or detecting the correct preamble but with the out-of-bounds timing estimation value. 

# For AWGN and NTN-TDLA100-200, a timing estimation error occurs if the estimation error of the timing of the 
# strongest path is larger than the time error tolerance values given in table 8.4.1.1-1. 

# Adjust the AWGN generator, according to the SCS and channel bandwidth defined in table 8.4.1.4.2-1.

# The characteristics of the wanted signal shall be configured according to the corresponding UL reference 
# measurement channel defined in annex A and the test parameter msg1-FrequencyStart is set to 0. 

# The multipath fading emulators shall be configured according to the corresponding channel model defined in annex G. 

# Adjust the frequency offset of the test signal according to table 8.4.1.5-1/2/3.

# Adjust the equipment so that the SNR in table 8.4.1.5-1/2/3 is achieved at the SAN input during the PRACH preambles.

# The test signal generator sends a preamble, and the receiver tries to detect the preamble. 
# The following statistics are kept: number of preambles detected in the idle period and the number of missed preambles 

# Timing offset scheme for format B4 and C2: base value 0, incremented by 0.1 us per step up to 0.8 us

# Set test_mode to false_detection_rate for false detection tests

[test]
bw           = 5                    # channel bandwidth in MHz
scs          = 15                   # sub-carrier spacing in kHz (15, 30)
prach_scs    = 15                   # PRACH subcarrier spacing in kHz (1.25, 15, 30)
num_rx       = 1                    # number of RX antennas: 1 or 2
propagation  = NTN_TDLA100_200_SISO # propagation condition: AWGN or NTN_TDLA100_200_SISO / NTN_TDLA100_200_LOW
burst_format = B4                   # PRACH burst format: 0 or 2 (1.25 kHz); B4 or C2 (15/30 kHz)
test_mode    = detection_rate       # test mode: detection_rate or false_detection_rate
cell_id      = 0                    # cell ID
ue_id        = 0                    # UE ID

freq         = 1620000000           # RF frequency in Hz
