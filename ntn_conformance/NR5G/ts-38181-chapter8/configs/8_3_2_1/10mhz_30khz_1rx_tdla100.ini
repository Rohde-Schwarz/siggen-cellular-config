# § 8.3.2.1 Performance requirements for PUCCH format 1 - NACK to ACK detection

# The performance is measured by the required SNR at probability of the NACK to ACK detection equal to 0.1% or less. 
# The probability of false detection of the ACK shall be 0.01 or less. 

# The probability of false detection of the ACK is defined as a conditional probability of erroneous detection of ACK 
# at particular bit position when input is only noise. Each false bit detection is counted as one error.

# Adjust the AWGN generator, according to the subcarrier spacing and channel bandwidth defined in table 
# 8.3.2.1.4.2-1.

# The characteristics of the wanted signal shall be configured according to TS 38.211, and the specific test 
# parameters are configured as mentioned in table 8.3.2.1.4.2-2

# The multipath fading emulators shall be configured according to the corresponding channel model defined in 
# annex G. 

# Adjusting the equipment so that the SNR specified in table 8.3.2.1.5-1 and table 8.3.2.1.5-2 is achieved at the 
# SAN input during the transmissions. 

# The signal generator sends random codeword from applicable codebook, in regular time periods. The following 
# statistics are kept: the number of ACK bits detected in the idle periods and the number of NACK bits detected as 
# ACK.

[test]
bw          = 10                    # channel bandwidth in MHz
scs         = 30                    # sub-carrier spacing in kHz (15, 30, 60)
num_rx      = 1                     # number of RX antennas: 1 or 2
propagation = NTN_TDLA100_200_SISO  # propagation condition: NTN_TDLA100_200_SISO or NTN_TDLC5_200_SISO
cell_id     = 0                     # cell ID
ue_id       = 0                     # UE ID

freq        = 1620000000            # RF frequency in Hz
