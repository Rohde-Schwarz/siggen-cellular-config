# § 8.2.3 Performance requirements for UL timing adjustment

# In the tests for UL timing adjustment, two signals are configured, one being transmitted by a moving UE and the other 
# being transmitted by a stationary UE. FRC parameters in Table A.3-1 are 
# applied for both UEs. The received power for both UEs is the same. The resource blocks allocated for both UEs are 
# consecutive. 

# Adjust the AWGN generator, according to combination of SCS and channel bandwidth defined in table 8.2.3.4.2-1. 

# The characteristics of the wanted signals (transmitted by moving UE) shall be configured according to the 
# corresponding UL reference measurement channel defined in annex A and the test parameters in Table 8.2.3.4.2-2. 

# The multipath fading emulators shall be configured according to the corresponding channel model defined in annex G.3. 

# Adjust the equipment so that required SNR specified in Table 8.2.3.5-1 to Table 8.2.3.5-2 is achieved at the SAN 
# input for normal mode. 

# For each of the reference channels in Table 8.2.3.5-1 to Table 8.2.3.5-2 applicable for the BS, measure 
# the throughput for normal mode. 


[test]
bw          = 10             # channel bandwidth in MHz
scs         = 30             # sub-carrier spacing in kHz (15, 30)
pusch_type  = B              # PUSCH mapping type: A or B
num_rx      = 2              # number of RX antennas: 1 or 2
propagation = MP_NTN_30     # propagation condition: MP_NTN_15 (15 kHz) or MP_NTN_30 (30 kHz)
cell_id     = 0             # cell ID
moving_ue_id = 0             # moving UE ID
stationary_ue_id = 0             # stationary UE ID

freq     = 1620000000  # RF frequency in Hz
