# § 8.3.4 Performance requirements for PUCCH format 3

# The performance is measured by the required SNR at UCI block error probability not exceeding 1%. 

# The UCI block error probability is the conditional probability of incorrectly decoding the UCI information 
# when the UCI information is sent. The UCI information does not contain CSI part 2. 

# Adjust the AWGN generator, according to the subcarrier spacing and channel bandwidth defined in table 
# 8.3.4.4.2-1.

# The characteristics of the wanted signal shall be configured according to TS 38.211, and the specific test 
# parameters are configured as mentioned in table 8.3.4.4.2-2

# The multipath fading emulators shall be configured according to the corresponding channel model defined in 
# annex G. 

# Adjust the equipment so that the SNR specified in table 8.3.4.5-1 and table 8.3.4.5-2 is achieved at the SAN 
# input during the UCI transmissions. 

# The signal generator sends a test pattern with the pattern outlined in figure 8.3.4.4.2-1. The following statistics 
# are kept: the number of incorrectly decoded UCI.

[test]
bw          = 10                   # channel bandwidth in MHz
scs         = 30                   # sub-carrier spacing in kHz (15, 30, 60)
num_rx      = 2                    # number of RX antennas: 1 or 2
propagation = NTN_TDLA100_200_LOW   # propagation condition: NTN_TDLA100_200_LOW or NTN_TDLC5_200_LOW
additional_dmrs = false            # additional DM-RS configuration: true or false
cell_id     = 0                    # cell ID
ue_id       = 0                    # UE ID

freq        = 1620000000           # RF frequency in Hz
