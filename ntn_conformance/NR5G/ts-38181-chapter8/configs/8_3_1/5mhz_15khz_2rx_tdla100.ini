# § 8.3.1 Performance requirements for PUCCH format 0 

# The performance is measured by the required SNR at probability of detection equal to 0.99. 
# The probability of false detection of the ACK shall be 0.01 or less.

# The probability of false detection of the ACK is defined as a conditional probability of erroneous detection of the ACK 
# when input is only noise. 

# The probability of detection of ACK is defined as conditional probability of detection of the ACK when the signal is 
# present. 

# Adjust the AWGN generator, according to the subcarrier spacing and channel bandwidth defined in table 
# 8.3.1.4.2-1. 

# The characteristics of the wanted signal shall be configured according to TS 38.211 [8] and the specific test 
# parameters are configured as mentioned in table 8.3.1.4.2-2

# The multipath fading emulators shall be configured according to the corresponding channel model defined in 
# annex G. 

# Adjust the equipment so that the SNR specified in table 8.3.1.5-1 and table 8.3.1.5-2 is achieved at the SAN 
# input during the ACK transmissions. 

# The signal generator sends a test pattern with the pattern outlined in figure 8.3.1.4.2-1. The following statistics 
# are kept: the number of ACKs detected in the idle periods and the number of missed ACKs. 

# Set test_mode to false_detection_rate for false detection tests

[test]
bw          = 5                     # channel bandwidth in MHz
scs         = 15                   # sub-carrier spacing in kHz (15, 30, 60)
num_rx      = 2                     # number of RX antennas: 1 or 2
propagation = NTN_TDLA100_200_LOW  # propagation condition: NTN_TDLA100_200_LOW or NTN_TDLC5_200_LOW
test_mode   = detection_rate        # test mode: detection_rate or false_detection_rate
cell_id     = 0                     # cell ID
ue_id       = 0                     # UE ID

freq     = 1620000000               # RF frequency in Hz
