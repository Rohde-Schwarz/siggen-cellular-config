# § 8.2.5 Performance requirements for PUSCH with DMRS bundling 

# Adjust the AWGN generator, according to the channel bandwidth, defined in table 8.2.5.4.2-1. 

# The characteristics of the wanted signal shall be configured according to the corresponding UL reference 
# measurement channel defined in annex A and the test parameters in table 8.2.5.4.2-2. 

# The multipath fading emulators shall be configured according to the corresponding channel model defined in 
# annex G.2. 

# Adjust the equipment so that required SNR specified in table 8.2.5.5-1 to table 8.2.5.5-4 is achieved at the SAN 
# input. 

# For each of the reference channels in table 8.2.5.5-1 to table 8.2.5.5-4 applicable for the BS, measure the throughput

[test]
bw          = 10                    # channel bandwidth in MHz
scs         = 30                   # sub-carrier spacing in kHz (15, 30, 60)
pusch_type  = B                     # PUSCH mapping type: A or B
num_rx      = 1                     # number of RX antennas: 1 or 2
propagation = NTN_TDLA100_200_SISO  # propagation condition: NTN_TDLA100_200_SISO or NTN_TDLC5_200_SISO
cell_id  = 0                        # cell ID
ue_id    = 0                        # UE ID

freq     = 1620000000               # RF frequency in Hz
