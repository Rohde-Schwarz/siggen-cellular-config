# § 8.3.6.1.2 Performance requirements for multi-slot PUCCH format 1 - ACK missed detection

# The performance is measured by the required SNR at probability of detection equal to 0.99. 

# The probability of false detection of the ACK shall be 0.01 or less. 

# The probability of false detection of the ACK is the conditional probability of erroneous detection of the ACK 
# when input is only noise. 

# The probability of detection of ACK is the conditional probability of detection of the ACK when the signal is 
# present. 

# Adjust the AWGN generator, according to the combinations of SCS and channel bandwidth defined in table 
# 8.3.6.1.2.4.2-1.

# The characteristics of the wanted signal shall be configured according to TS 38.211, and the specific test 
# parameters are configured as mentioned in table 8.3.6.1.2.4.2-2

# The multipath fading emulators shall be configured according to the corresponding channel model defined in 
# annex G. 

# Adjusting the equipment so that the SNR specified in table 8.3.6.1.2.5-1 and table 8.3.6.1.2.5-2 is achieved at the 
# SAN input during the transmissions. 

# The signal generator sends random codewords from applicable codebook, in regular time periods. The following 
# statistics are kept: the number of ACK bits falsely detected in the idle periods and the number of missed ACK 
# bits. Each falsely detected ACK bit in the idle periods is accounted as one error for the statistics of false ACK 
# detection, and each missed ACK bit is accounted as one error for the statistics of missed ACK detection.

# Set test_mode to false_detection_rate for false detection tests

[test]
bw          = 10                   # channel bandwidth in MHz
scs         = 30                   # sub-carrier spacing in kHz (15, 30, 60)
num_rx      = 1                    # number of RX antennas: 1 or 2
propagation = NTN_TDLA100_200_SISO  # propagation condition: NTN_TDLA100_200_SISO or NTN_TDLC5_200_SISO
test_mode   = detection_rate       # test mode: detection_rate or false_detection_rate
cell_id     = 0                    # cell ID
ue_id       = 0                    # UE ID

freq        = 1620000000           # RF frequency in Hz
