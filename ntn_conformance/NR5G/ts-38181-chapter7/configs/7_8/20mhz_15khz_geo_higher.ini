# § 7.8 In-channel Selectivity (ICS)

# Set the signal generator for the wanted signal to transmit as specified from table 7.8.5-1 and 7.8.5-2 as well as 
# Table 7.8.5-1a and 7.8.5-2a for a SAN declared to be capable of NB-IoT operation in NTN NR in-band (D.60).

# Set the signal generator for the interfering signal (PUSCH with Transform Precodingt) to transmit 
# at the frequency offset and as specified from table 7.8.5-1 and 7.8.5-2 as well as Table 7.8.5-2a and 7.8.5-2b 
# for a SAN declared to be capable of NB-IoT operation in NTN NR in-band (D.60).

# Use parameter "interference_pos" to set whether the interfering signal is placed at lower or higher resource blocks.

[test]
bw                 = 20      # channel bandwidth in MHz
scs                = 15     # sub-carrier spacing in kHz (15, 30, 60)
san_class          = geo    # SAN class: leo or geo
interference_pos   = higher # position of the interferer signal: higher or lower
cell_id            = 0      # cell ID
ue_id              = 0      # UE ID
interferer_cell_id = 0      # interferer cell ID
interferer_ue_id   = 0      # interferer UE ID

freq = 1620000000           # RF frequency in Hz
