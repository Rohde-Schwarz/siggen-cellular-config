# § 7.3 Dynamic Range

# Table 7.3.2.1-1: SAN LEO dynamic range — wanted signal with AWGN interference

# Set the signal generator for the wanted signal to transmit as specified in table 7.3.5-1 according to the 
# appropriate SAN class as well as table 7.3.5-1a for a SAN declared to be capable of NB-IoT operation in NTN 
# in-band (D.60). (as per V19.3.0, only defined for SAN LEO)

# Set the Signal generator for the AWGN interfering signal at the same frequency as the wanted signal to transmit 
# as specified in table 7.3.5-1 according to the appropriate SAN class as well as table 7.3.5-1a for a SAN declared 
# to be capable of NB-IoT operation in NTN NR in-band (D.60). 

[test]
bw            = 10      # channel bandwidth in MHz
scs           = 15     # sub-carrier spacing in kHz (15, 30, 60)
cell_id       = 0      # cell ID
ue_id         = 0      # UE ID

freq = 1620000000      # RF frequency in Hz
