# § 7.2 Reference Sensitivity Level

# Table 7.2.5-2: SAN LEO class reference sensitivity levels

# Start the signal generator for the wanted signal to transmit the Fixed Reference Channels 
# for reference sensitivity according to annex A.1. 
# Set the signal generator for the wanted signal power as specified in clause 7.2.5-1/2
# Use flag nb-iot-inband to set the NB-IoT in-band FRC (BW 5–20 MHz, SCS 15 kHz only), for SAN
# that supports NB-IoT operation in NTN NR in-band.

[test]
bw            = 15      # channel bandwidth in MHz
scs           = 60     # sub-carrier spacing in kHz (15, 30, 60)
san_class     = leo    # SAN class: leo or geo
cell_id       = 0      # cell ID
ue_id         = 0      # UE ID

freq = 1620000000      # RF frequency in Hz

nb_iot_inband = false  # true to use NB-IoT in-band FRC (BW 5–20 MHz, SCS 15 kHz only)

