# § 7.5 Out-of-Band Blocking

# Set the signal generator for the wanted signal as defined in clause 7.5.5 to transmit as specified in table 7.5.5-1
# Set the signal generator for the interfering signal to transmit at the frequency offset defined in table 7.5.5-1
# The CW interfering signal shall be swept with a step size of 1 MHz over than range
# 1 MHz to (FUL_low - fOOB) MHz and (FUL_high + ΔfOOB) MHz to 12750 MHz
# where ΔfOOB is defined in table 7.5.5-2 as 20 MHz

# Use band to set the uplink operating band and the related F_UL,low and F_UL,high frequencies
# For FR1, following operating bands are defined:
# n253: 1668 MHz - 1675 MHz
# n254: 1610 MHz - 1626.5 MHz
# n255: 1626.5 MHz - 1660.5 MHz
# n256: 1980 MHz - 2010 MHz

[test]
bw              = 10            # channel bandwidth in MHz
scs             = 15            # sub-carrier spacing in kHz (15, 30, 60)
san_class       = geo           # SAN class: leo or geo
band            = n254          # uplink operating band: n253, n254, n255, n256
interferer_freq = 1500000000    # interferer frequency in Hz
cell_id         = 0             # cell ID
ue_id           = 0             # UE ID

freq = 1620000000               # RF frequency in Hz

nb_iot_inband = false  # true is only valid for BW 5–20 MHz, SCS 15 kHz combinations
