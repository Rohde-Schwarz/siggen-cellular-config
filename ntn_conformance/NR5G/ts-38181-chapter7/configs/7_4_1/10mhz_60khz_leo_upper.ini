# § 7.4.1 Adjacent Channel Selectivity (ACS)

# Set the signal generator for the wanted signal to transmit as specified in table 7.4.1.5-1, using 
# PREFSENS values defined in table 7.2.2-1.
# Set the signal generator for the interfering signal (PDSCH) to transmit at the frequency offset 
# and as specified in table 7.4.1.5-1 and 7.4.1.5-2. 

# Interferer signal can be placed on lower or upper side of the SAN channel bandwidth.
# Use parameter "edge" to place the interferer signal in one of the sides.

[test]
bw                 = 10      # channel bandwidth in MHz
scs                = 60     # sub-carrier spacing in kHz (15, 30, 60)
san_class          = leo    # SAN class: leo or geo
edge               = upper  # position of the interferer signal: lower or upper
cell_id            = 0      # cell ID
ue_id              = 0      # UE ID
interferer_cell_id = 0      # interferer cell ID
interferer_ue_id   = 0      # interferer UE ID

freq = 1620000000           # RF frequency in Hz
